data:
  graph_dir: data/processed/graph
  splits_path: data/processed/splits/split_indices.npz

runtime:
  device: cpu
  seed: 42
  log_every: 5

model:
  hidden_channels: 64
  out_channels: 2
  dropout: 0.6

optimizer:
  lr: 0.01
  weight_decay: 0.0005

training:
  epochs: 200
  select_metric: val_f1

output:
  results_path: reports/gcn_sweep_results.json
  best_config_path: reports/gcn_best_config.yaml